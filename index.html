 if((m=s.match(/^CREATE\s+(?:OR\s+REPLACE\s+)?VIEW\s+(\w+)\s+AS\s+(SELECT[\s\S]+)$/i))){db.views[m[1].toLowerCase()]=m[2];return "View created.";}
 if((m=s.match(/^DROP\s+(TABLE|VIEW|TRIGGER|PROCEDURE|FUNCTION)\s+(\w+)$/i))){let k={TABLE:"tables",VIEW:"views",TRIGGER:"triggers",PROCEDURE:"procedures",FUNCTION:"functions"}[m[1].toUpperCase()],n=m[2].toLowerCase();if(!db[k][n])fail("ORA-00942: object does not exist: "+n);delete db[k][n];return "Object dropped.";}
 if((m=s.match(/^ALTER\s+TABLE\s+(\w+)\s+ADD\s+(\w+)\s+[\w()]+$/i))){let t=table(m[1]);t.cols.push(m[2].toLowerCase());t.meta.push({name:m[2].toLowerCase()});t.rows.forEach(r=>r[m[2].toLowerCase()]=null);return "Column added.";}
 if((m=s.match(/^TRUNCATE\s+TABLE\s+(\w+)$/i))){table(m[1]).rows=[];return "Table truncated.";}
 if((m=s.match(/^EXEC(?:UTE)?\s+(\w+)\s*(?:\(([\s\S]*)\))?$/i))){let p=db.procedures[m[1].toLowerCase()];if(!p)fail("PLS-00201: procedure must be declared");let local={...scope};p.args.forEach((a,i)=>local[a]=evalExpr(parts(m[2]||"")[i]||"NULL",scope));return runBody(p.body,local);}
 if((m=s.match(/^OPEN\s+(\w+)$/i))){let c=cursors[m[1].toLowerCase()];if(!c)fail("PLS-00201: cursor must be declared");c.rows=select(c.query,scope);c.index=0;c.open=true;return "Cursor opened.";}

 if((m=s.match(/^CLOSE\s+(\w+)$/i))){let c=cursors[m[1].toLowerCase()];if(!c?.open)fail("ORA-01001: invalid cursor");c.open=false;return "Cursor closed.";}
 fail("ORA-00900: invalid or unsupported SQL statement");
}
function checkRow(t,r,old){
 for(let c of t.meta){let v=r[c.name];if(c.notNull&&v===null)fail("ORA-01400: cannot insert NULL");if(c.check&&!truth(evalExpr(c.check,r)))fail("ORA-02290: check constraint violated");}
 let sets=[...(t.pk?[t.pk]:[]),...t.unique];for(let cols of sets){if(cols.some(c=>r[c]===null))continue;if(t.rows.some(x=>x!==old&&cols.every(c=>norm(x[c])===norm(r[c]))))fail("ORA-00001: unique constraint violated");}
 for(let fk of t.fks){let vals=fk.cols.map(c=>r[c]);if(vals.every(v=>v===null))continue;let parent=table(fk.table);if(!parent.rows.some(pr=>fk.refs.every((c,i)=>norm(pr[c])===norm(vals[i]))))fail("ORA-02291: integrity constraint violated - parent key not found");}
}
function runBody(body,scope={}){let result=null;for(let s of splitStatements(body.replace(/^\s*BEGIN\b/i,"").replace(/\bEND\s*;?\s*$/i,""))){let m=s.match(/^RETURN\s+([\s\S]+)$/i);if(m)result=evalExpr(m[1],{},scope);else if((m=s.match(/^([\w]+)\s*:=\s*([\s\S]+)$/i)))scope[m[1].toLowerCase()]=evalExpr(m[2],{},scope);else result=execute(s,scope);}return result??"PL/SQL block executed.";}
function callFunction(name,args,scope={}){let f=db.functions[name.toLowerCase()];if(!f)fail("ORA-00904: invalid identifier: "+name);let local={...scope};f.args.forEach((a,i)=>local[a]=args[i]);return runBody(f.body,local);}
function run(){
 let statements=splitStatements($("sql").value),last=null,messages=[],done=0;
 try{for(let i=0;i<statements.length;i++){let s=statements[i],r;
  if(/^DECLARE\b|^BEGIN\b/i.test(s)){let dec=s.match(/CURSOR\s+(\w+)\s+IS\s+(SELECT[\s\S]*?);/i);if(dec)cursors[dec[1].toLowerCase()]={query:dec[2],rows:[],index:0,open:false};r=runBody(s.replace(/^DECLARE[\s\S]*?\bBEGIN\b/i,"").replace(/^BEGIN\b/i,"").replace(/\bEND\s*$/i,""),{});}
  else r=execute(s);
  if(Array.isArray(r))last=r;else if(r)messages.push(r);done++;
 }
 render(last);$("prompt").textContent="Statement(s) completed successfully. "+(last?last.length+" row(s) selected.":messages.join(" "));
 }catch(e){$("prompt").textContent="Statement "+(done+1)+" failed: "+e.message;render(last);let box=document.createElement("div");box.className="error";box.textContent="Statement "+(done+1)+" failed: "+e.message;$("out").append(box);}
 log.unshift("SQL> "+statements.join(" | "));$("history").textContent=log.slice(0,15).join("\n");
}
function render(rows){let out=$("out");out.replaceChildren();if(rows===null){let x=document.createElement("span");x.className="success";x.textContent="Statement processed.";out.append(x);return;}if(!rows.length){out.textContent="no rows selected";return;}let cols=[...new Set(rows.flatMap(r=>Object.keys(r)))],t=document.createElement("table"),h=document.createElement("tr");cols.forEach(c=>{let th=document.createElement("th");th.textContent=c.toUpperCase();h.append(th);});let hd=document.createElement("thead");hd.append(h);t.append(hd);let bd=document.createElement("tbody");rows.forEach(r=>{let tr=document.createElement("tr");cols.forEach(c=>{let td=document.createElement("td");td.textContent=r[c]===null?"(null)":r[c]??"";tr.append(td);});bd.append(tr);});t.append(bd);out.append(t);}
db.tables.dual={cols:["dummy"],meta:[{name:"dummy"}],rows:[{dummy:"X"}]};
const log=[];
$("run").onclick=run;$("clear").onclick=()=>$("sql").value="";$("reset").onclick=()=>{for(let k of Object.keys(db))db[k]={};db.tables.dual={cols:["dummy"],meta:[{name:"dummy"}],rows:[{dummy:"X"}]};Object.keys(cursors).forEach(k=>delete cursors[k]);$("prompt").textContent="Database session reset.";$("out").textContent="No tables.";};
$("sample").onclick=()=>$("sql").value=`CREATE TABLE students (id NUMBER PRIMARY KEY, name VARCHAR2(30), department VARCHAR2(20), marks NUMBER);
INSERT INTO students VALUES (1, 'Anu', 'BCA', 85);
INSERT INTO students VALUES (2, 'Ravi', 'BCA', 72);
INSERT INTO students VALUES (3, 'Maya', 'BCom', 91);
SELECT * FROM students;
SELECT department, COUNT(*) AS total FROM students GROUP BY department HAVING COUNT(*) > 1;`;
$("save").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([$("sql").value],{type:"text/plain"}));a.href=u;a.download="chai_queries.sql";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$("sql").addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter")run();});
})();
